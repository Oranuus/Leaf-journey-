<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaf Journey: Boss Edition</title>
    <style>
        /* --- LOAD CUSTOM FONT --- */
        @font-face {
            font-family: 'Daily Bubble';
            src: url('daily bubble.ttf'); 
        }

        :root {
            --primary: #ff9966;
            --secondary: #76ff03;
            --danger: #ff3333;
            --panel-bg: rgba(20, 20, 35, 0.90);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
            font-family: 'Daily Bubble', 'Segoe UI', Tahoma, sans-serif;
            color: white;
            user-select: none;
            touch-action: none;
        }

        #gameWrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #162447; 
        }

        /* UI Layers */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .hidden {
            opacity: 0;
            pointer-events: none !important;
            z-index: -1;
        }

        /* --- HUD --- */
        #hud {
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px;
            box-sizing: border-box;
            width: 100%;
            pointer-events: none;
        }

        .hud-group { display: flex; flex-direction: column; gap: 5px; }

        .hud-text {
            font-size: clamp(20px, 4vw, 32px);
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
        }
        .color-leaf { color: var(--secondary); }
        .color-dist { color: #4facfe; }

        .shield-indicator {
            color: #4facfe;
            font-weight: bold;
            text-shadow: 1px 1px 4px #000;
            display: none;
            font-size: 18px;
        }

        /* BOSS HUD */
        #bossHud {
            position: absolute;
            top: 60px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .boss-bar-container {
            width: 50%;
            max-width: 400px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        #bossHealthFill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #b71c1c);
            transition: width 0.2s;
        }
        #bossTimer {
            font-size: 24px;
            color: #ffcc00;
            text-shadow: 2px 2px 0 #000;
        }

        /* --- PAUSE BUTTON --- */
        #pauseBtnContainer {
            position: absolute;
            top: 15px;
            right: 15px;
            pointer-events: auto;
            z-index: 100;
            transition: opacity 0.3s;
        }
        
        .pause-icon-btn {
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            width: 35px; 
            height: 35px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            backdrop-filter: blur(2px);
            transition: all 0.2s;
        }
        .pause-icon-btn:hover { 
            background: var(--primary); 
            color: white;
            border-color: white;
            transform: scale(1.1); 
        }

        /* --- MENUS --- */
        .menu-box {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid var(--primary);
            box-shadow: 0 0 40px rgba(255, 153, 102, 0.4);
            max-width: 500px; 
            width: 85%;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: auto;
            position: relative;
            z-index: 20;
            animation: boxPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes boxPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .game-title {
            margin: 0 0 20px 0; 
            color: var(--primary); 
            font-size: clamp(2.5rem, 6vw, 4.5rem); 
            text-transform: uppercase; 
            letter-spacing: 3px;
            text-shadow: 4px 4px 0px #000;
            animation: floatTitle 3s ease-in-out infinite;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        h2 { color: white; border-bottom: 1px solid #555; padding-bottom: 10px; margin-bottom: 20px; }
        
        .currency-display {
            background: rgba(255,255,255,0.1);
            display: inline-block;
            padding: 10px 25px;
            border-radius: 30px;
            margin-bottom: 25px;
            border: 2px solid var(--secondary);
            color: var(--secondary);
            font-weight: bold;
            font-size: 1.4rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button {
            background: linear-gradient(45deg, #ff9966, #ff5e62);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            font-family: 'Daily Bubble', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0px #b71c1c; 
            width: 100%;
            max-width: 280px;
            text-transform: uppercase;
            margin-top: 15px;
            pointer-events: auto;
            position: relative;
            z-index: 21;
        }

        button:active { transform: translateY(4px); box-shadow: 0 2px 0px #b71c1c; }
        button:hover { filter: brightness(1.1); }
        
        button.secondary { background: #444; box-shadow: 0 6px 0px #222; }
        button.secondary:active { box-shadow: 0 2px 0px #222; }
        
        button.airship-btn { background: linear-gradient(45deg, #4facfe, #00f2fe); box-shadow: 0 6px 0px #0277bd; }
        button.airship-btn:active { box-shadow: 0 2px 0px #0277bd; }

        button.danger-btn {
            background: linear-gradient(45deg, #ff3333, #b71c1c);
            margin-top: 30px;
            font-size: 14px;
            padding: 10px 30px;
            width: auto;
            box-shadow: 0 4px 0px #7f0000;
        }
        button.danger-btn:active { box-shadow: 0 2px 0px #7f0000; }

        /* Option Buttons */
        .option-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .option-toggle span { font-size: 1.2rem; }
        .toggle-status { font-weight: bold; color: var(--secondary); }
        .toggle-status.off { color: var(--danger); }

        /* Upgrade Grid */
        .upgrade-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; width: 100%; }
        .upgrade-card {
            background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid transparent; transition: 0.2s;
            pointer-events: auto;
        }
        .upgrade-card:hover { border-color: var(--primary); background: rgba(255,255,255,0.1); }
        .upg-info { text-align: left; }
        .upg-name { font-weight: bold; color: var(--primary); font-size: 1rem; }
        .upg-desc { font-size: 0.8rem; color: #aaa; font-family: 'Segoe UI', sans-serif; }
        .upg-level { font-size: 0.8rem; color: #4facfe; margin-top: 4px; }
        .buy-btn { width: auto; padding: 5px 15px; font-size: 0.9rem; background: var(--secondary); color: #000; margin:0; box-shadow: 0 3px 0 #33691e;}
        .buy-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #33691e; }
        .buy-btn:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

        /* Trade Menu specific */
        #tradeMenu {
            background: rgba(0,0,0,0.2); 
            backdrop-filter: none;
            flex-direction: column;
            justify-content: center;
        }

        .trade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
            pointer-events: auto;
        }

        .trade-item {
            width: 140px;
            height: 140px;
            border: 5px solid black; 
            background: rgba(0, 0, 0, 0.6); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }

        .trade-item:hover {
            transform: scale(1.05);
            background: rgba(0, 0, 0, 0.8);
            border-color: var(--secondary);
        }

        .trade-icon { font-size: 40px; margin-bottom: 5px; }
        .trade-name { font-size: 14px; font-weight: bold; color: white; text-align: center; line-height: 1.2;}
        .trade-cost { font-size: 16px; color: var(--secondary); margin-top: 5px; font-weight: bold; }

    </style>
    
    <!-- Load External Music Scripts -->
    <script src="menu_sound.js"></script>
    <script src="air_sound.js"></script>

        <!-- Link Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9966">

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.log('SW Failed!', err));
        });
      }
    </script>
    
</head>
<body>

<div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- PAUSE BUTTON -->
    <div id="pauseBtnContainer" class="hidden">
        <button class="pause-icon-btn" onclick="window.gameManager.togglePause()">||</button>
    </div>

    <!-- MAIN HUD -->
    <div id="hud" class="ui-layer hidden">
        <div class="hud-group">
            <div class="hud-text color-leaf">Leaves: <span id="scoreVal">0</span></div>
            <div id="shieldHud" class="shield-indicator">SHIELD ACTIVE</div>
        </div>
        <div class="hud-group" style="align-items: flex-end; margin-right: 40px;"> 
            <div class="hud-text color-dist"><span id="distVal">0.00</span> km</div>
        </div>
    </div>

    <!-- BOSS HUD -->
    <div id="bossHud">
        <div class="boss-bar-container">
            <div id="bossHealthFill"></div>
        </div>
        <div id="bossTimer">02:00</div>
    </div>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="ui-layer interactive">
        <div class="menu-box">
            <h1 class="game-title">Leaf<br>Journey</h1>
            <div class="currency-display">Total Leaves: <span id="menuTotalLeaves">0</span></div>
            <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
                <button onclick="window.gameManager.startGame()">Start Journey</button>
                <button class="secondary" onclick="window.gameManager.openUpgrades()">Upgrades</button>
                <button class="secondary" onclick="window.gameManager.openOptions()">Options</button>
            </div>
        </div>
    </div>

    <!-- OPTIONS MENU -->
    <div id="optionsMenu" class="ui-layer interactive hidden">
        <div class="menu-box">
            <h2>Options</h2>
            
            <button class="option-toggle secondary" onclick="window.gameManager.toggleMenuMusic()" style="margin-top:0;">
                <span>Menu Music</span>
                <span id="txtMenuMute" class="toggle-status">ON</span>
            </button>
            
            <button class="option-toggle secondary" onclick="window.gameManager.toggleAirMusic()" style="margin-top:0;">
                <span>Air Music</span>
                <span id="txtAirMute" class="toggle-status">ON</span>
            </button>

            <button class="danger-btn" onclick="window.gameManager.resetData()">Reset Data</button>

            <button onclick="window.gameManager.closeOptions()" style="margin-top:20px;">Back</button>
        </div>
    </div>

    <!-- PAUSE MENU -->
    <div id="pauseMenu" class="ui-layer interactive hidden">
        <div class="menu-box">
            <h1 style="font-size: 3rem; margin-bottom: 30px;">Paused</h1>
            <div style="display:flex; flex-direction:column; gap:15px; align-items:center;">
                <button onclick="window.gameManager.togglePause()">Resume</button>
                <button class="secondary" onclick="window.gameManager.toMainMenu()">Quit to Menu</button>
            </div>
        </div>
    </div>

    <div id="upgradeMenu" class="ui-layer interactive hidden">
        <div class="menu-box">
            <h2>Power Ups</h2>
            <div class="currency-display">Balance: <span id="shopTotalLeaves">0</span></div>
            <div class="upgrade-grid"></div>
            <button class="secondary" onclick="window.gameManager.closeUpgrades()">Back</button>
        </div>
    </div>

    <div id="airshipMenu" class="ui-layer interactive hidden">
        <div class="menu-box" style="border-color: #4facfe; box-shadow: 0 0 30px rgba(79, 172, 254, 0.3);">
            <h1 style="color: #4facfe; font-size: 2.5rem;">The Merchant</h1>
            <p style="font-size: 1.2rem; color: #ddd; margin-bottom: 20px;">An airship offers you sanctuary.</p>
            <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
                <button class="airship-btn" onclick="window.gameManager.enterAirship()">Enter</button>
                <button class="secondary" onclick="window.gameManager.leaveAirship()">Continue Journey</button>
            </div>
        </div>
    </div>

    <div id="tradeMenu" class="ui-layer hidden">
        <div class="currency-display" style="margin-bottom: 40px; pointer-events:auto;">Current Run Leaves: <span id="tradeLeaves">0</span></div>
        <div class="trade-grid">
            <div class="trade-item" onclick="window.gameManager.buyTradeItem('fork', 10)">
                <div class="trade-icon">🍴</div>
                <div class="trade-name">Hire Fork</div>
                <div class="trade-cost">10 🍃</div>
            </div>
            <div class="trade-item" onclick="window.gameManager.buyTradeItem('shield', 15)">
                <div class="trade-icon">🛡️</div>
                <div class="trade-name">Repair Shield</div>
                <div class="trade-cost">15 🍃</div>
            </div>
            
            <div class="trade-item" style="opacity: 0.5; cursor: default;">
                <div class="trade-icon">🔒</div>
                <div class="trade-name">Sold Out</div>
            </div>
            <div class="trade-item" style="opacity: 0.5; cursor: default;">
                <div class="trade-icon">🔒</div>
                <div class="trade-name">Sold Out</div>
            </div>
        </div>
        <div style="width: 100%; display: flex; justify-content: center; pointer-events: auto;">
            <button class="secondary" onclick="window.gameManager.leaveAirship()">Exit Shop</button>
        </div>
    </div>

    <div id="gameOverScreen" class="ui-layer interactive hidden">
        <div class="menu-box">
            <h1 style="color: var(--danger)">Cut Down!</h1>
            <p style="font-size: 1.2rem;">Distance: <span id="finalDist" style="color:#4facfe">0</span> km</p>
            <p style="font-size: 1.2rem;">Collected: <span id="finalScore" style="color:var(--secondary)">0</span></p>
            <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
                <button onclick="window.gameManager.startGame()">Fly Again</button>
                <button class="secondary" onclick="window.gameManager.toMainMenu()">Main Menu</button>
            </div>
        </div>
    </div>
</div>

<script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        alert("Game Error: " + msg + "\nLine: " + lineNo);
        return false;
    };

    /** --- AUDIO SYSTEM --- */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playModernBuy() {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, t); 
        osc.frequency.setValueAtTime(659.25, t + 0.1); 
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.2, t + 0.05); 
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5); 
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.5);
    }

    /** --- ASSET LOADING --- */
    const imgPlayer = new Image(); imgPlayer.src = 'orange leaf.png';
    const imgGreen = new Image(); imgGreen.src = 'green leaf.png';
    const imgBg = new Image(); imgBg.src = 'bg1.png';
    const imgBird = new Image(); imgBird.src = 'bird.png';
    const imgFork = new Image(); imgFork.src = 'fork.png';
    const imgAirship = new Image(); imgAirship.src = 'airship.png'; 
    const imgTrade = new Image(); imgTrade.src = 'Trade.png'; 

    /** --- GAME DATA & SAVING --- */
    let GameData = {
        leaves: 0,
        upgrades: { speed: 0, magnet: 0, shield: 0, fork: 0 },
        settings: { muteMenu: false, muteAir: false }
    };

    const UPGRADE_CONFIG = {
        speed: { name: "Wind Dash", desc: "Move faster vertically", baseCost: 30, max: 10 },
        magnet: { name: "Nature's Magnet", desc: "Attract leaves range", baseCost: 30, max: 10 },
        shield: { name: "Bark Shield", desc: "Start with a shield (1 hit)", baseCost: 200, max: 1 },
        fork: { name: "Old Friends", desc: "Summon fork allies", baseCost: 50, max: 7 }
    };

    function getForkStats() {
        const lvl = GameData.upgrades.fork || 0;
        let speed = 7; let range = 300; let count = 1; 
        if (lvl >= 1) speed += 4;       
        if (lvl >= 2) range = 250;      
        if (lvl >= 3) count = 2;        
        if (lvl >= 4) speed += 4;       
        if (lvl >= 5) range = 200;      
        if (lvl >= 6) range = 150;      
        if (lvl >= 7) count = 3;        
        return { speed, range, count };
    }

    function loadData() {
        try {
            const saved = localStorage.getItem('leafJourneySave_v3');
            if (saved) {
                const parsed = JSON.parse(saved);
                GameData.leaves = (typeof parsed.leaves === 'number') ? parsed.leaves : 0;
                GameData.upgrades = { ...GameData.upgrades, ...(parsed.upgrades || {}) };
                if (typeof GameData.upgrades.fork === 'undefined') GameData.upgrades.fork = 0;
                if (parsed.settings) GameData.settings = parsed.settings;
            }
        } catch (e) { console.log("Save error or fresh start"); }
        updateUI();
        updateAudioButtons();
    }
    function saveData() {
        localStorage.setItem('leafJourneySave_v3', JSON.stringify(GameData));
        updateUI();
    }
    function updateUI() {
        const menuEl = document.getElementById('menuTotalLeaves');
        const shopEl = document.getElementById('shopTotalLeaves');
        
        if(menuEl) menuEl.innerText = GameData.leaves;
        if(shopEl) shopEl.innerText = GameData.leaves;
    }
    function updateAudioButtons() {
        const btnMenu = document.getElementById('txtMenuMute');
        const btnAir = document.getElementById('txtAirMute');
        btnMenu.innerText = GameData.settings.muteMenu ? "OFF" : "ON";
        btnMenu.className = GameData.settings.muteMenu ? "toggle-status off" : "toggle-status";
        btnAir.innerText = GameData.settings.muteAir ? "OFF" : "ON";
        btnAir.className = GameData.settings.muteAir ? "toggle-status off" : "toggle-status";
    }

    /** --- ENGINE SETUP & RESIZING --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize(); 

    let gameState = "MENU"; 
    let score = 0;
    let distance = 0; 
    let gameSpeed = 4;
    let frame = 0;
    let hasShield = false;

    // --- AIRSHIP & GAMEPLAY VARIABLES ---
    function getRandomAirshipInterval() {
        return 7.0 + Math.random() * 7.0; 
    }
    let nextAirshipKm = getRandomAirshipInterval();

    let cameraZoom = 1.0;
    let worldScale = 1.0; 
    let zoomTimer = 0;    
    let airshipPos = { x: 0, y: 0 };
    let storedSpeed = 0;
    let repulseTimer = 0; 
    
    // --- BOSS VARIABLES ---
    let bossEncountered = false;
    let boss = null;

    let player = { x: 100, y: height / 2, radius: 18 }; 
    let items = [];
    let activeForks = []; 
    let particles = [];
    let windParticles = [];
    let floatingTexts = [];

    const keys = {};
    let mouseTargetY = null;

    window.addEventListener('keydown', e => {
        if(e.key === 'Escape' && (gameState === 'PLAYING' || gameState === 'PAUSED' || gameState === 'BOSS_FIGHT')) {
            window.gameManager.togglePause();
        }
        keys[e.key] = true;
    });
    window.addEventListener('keyup', e => keys[e.key] = false);
    
    window.addEventListener('mousemove', e => { 
        mouseTargetY = e.clientY; 
    });
    window.addEventListener('touchmove', e => {
        e.preventDefault();
        mouseTargetY = e.touches[0].clientY;
    }, {passive: false});
    window.addEventListener('touchstart', e => {
        mouseTargetY = e.touches[0].clientY;
    }, {passive: false});


    // --- CLASSES ---
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = Math.random() * 4;
            this.life = 1.0;
        }
        update() {
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.life -= 0.05;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    class FloatingText {
        constructor(x, y, text, color="#fff") {
            this.x = x; this.y = y; this.text = text; this.color = color; this.life = 1.0;
        }
        update() { this.y -= 1; this.life -= 0.02; }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.font = "24px 'Daily Bubble', Arial"; 
            ctx.fillText(this.text, this.x, this.y);
            ctx.globalAlpha = 1;
        }
    }

    class ScissorsBoss {
        constructor() {
            this.x = width + 200;
            this.y = height / 2;
            this.targetY = height / 2;
            this.radius = 80;
            this.hp = 12;
            this.maxHp = 12;
            this.survivalTimer = 120 * 60; // 2 minutes (60fps)
            this.attackTimer = 0;
            this.moveTimer = 0;
            this.state = "ENTERING";
            this.hitFlash = 0;
        }
        update() {
            if (this.state === "ENTERING") {
                this.x -= (this.x - (width + 50)) * 0.05;
                if (Math.abs(this.x - (width + 50)) < 5) {
                    this.state = "FIGHTING";
                    gameState = "BOSS_FIGHT";
                    document.getElementById('bossHud').style.opacity = 1;
                }
            } else if (this.state === "FIGHTING") {
                this.survivalTimer--;
                
                this.moveTimer++;
                if (this.moveTimer % 100 === 0) {
                    this.targetY = 100 + Math.random() * (height - 200);
                }
                this.y += (this.targetY - this.y) * 0.03;

                this.attackTimer++;
                if (this.attackTimer > 45) {
                    this.attackTimer = 0;
                    this.shoot();
                }

                if (this.hp <= 0 || this.survivalTimer <= 0) {
                    this.die();
                }
            } else if (this.state === "LEAVING") {
                this.x += 10;
                this.y -= 5;
                
                if (cameraZoom < 1.0) cameraZoom += 0.005;

                if (this.x > width + 300) {
                    gameState = "PLAYING";
                    bossEncountered = true;
                    boss = null;
                    gameSpeed = storedSpeed;
                    cameraZoom = 1.0; 
                    document.getElementById('bossHud').style.opacity = 0;
                    floatingTexts.push(new FloatingText(player.x, player.y - 50, "Victory!", "#4facfe"));
                }
            }
        }

        shoot() {
            const rand = Math.random();
            const spawnX = this.x - 50;
            const spawnY = this.y;

            if (rand < 0.4) {
                items.push({ 
                    type: 'scissor', 
                    x: spawnX, y: spawnY, 
                    radius: 20, active: true, 
                    isBossProjectile: true, vx: -8, vy: 0 
                });
            } else if (rand < 0.7) {
                 items.push({ 
                    type: 'scissor-yellow', 
                    x: spawnX, y: spawnY, 
                    radius: 35, active: true, 
                    isBossProjectile: true, vx: -4, vy: 0 
                });
            } else {
                 items.push({ 
                    type: 'scissor-purple', 
                    x: spawnX, y: spawnY, 
                    radius: 20, active: true, 
                    currentAngle: Math.PI,
                    isBossProjectile: true 
                });
            }
        }

        die() {
            this.state = "LEAVING";
            for(let i=0; i<30; i++) particles.push(new Particle(this.x, this.y, "#fff"));
        }

        draw(ctx) {
            drawScissor(this.x, this.y, 4, "#880000", 0);
            
            if (this.hitFlash > 0) {
                ctx.globalCompositeOperation = "source-atop";
                ctx.fillStyle = `rgba(255,255,255,${this.hitFlash})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, 100, 0, Math.PI*2); ctx.fill();
                ctx.globalCompositeOperation = "source-over";
                this.hitFlash -= 0.1;
            }
        }
    }

    class Fork {
        constructor(offsetIndex) {
            this.x = player.x; 
            this.y = player.y;
            this.radius = 15;
            this.state = 'IDLE'; 
            this.target = null;
            const stats = getForkStats();
            this.speed = stats.speed;
            this.detectRange = stats.range;
            this.offsetIndex = offsetIndex; 
            this.angle = 0;
            this.active = true;
        }
        update() {
            const stats = getForkStats();
            this.detectRange = stats.range; 

            if (this.state === 'IDLE') {
                const targetX = player.x - 40 - (this.offsetIndex * 25);
                const targetY = player.y + Math.sin(frame * 0.1 + this.offsetIndex) * 10; 
                this.x += (targetX - this.x) * 0.1;
                this.y += (targetY - this.y) * 0.1;
                this.angle = -Math.PI / 4; 

                if (gameState === "BOSS_FIGHT" && boss && boss.state === "FIGHTING") {
                    this.state = 'ATTACKING';
                    this.target = boss;
                    return;
                }

                let closest = null;
                let closestDist = this.detectRange; 

                items.forEach(item => {
                    if (item.active && (item.type.includes('scissor') || item.type === 'bird')) {
                        if(item.type === 'bird' && item.state !== 'flying') return;
                        const dx = item.x - this.x;
                        const dy = item.y - this.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closest = item;
                        }
                    }
                });

                if (closest) {
                    this.state = 'ATTACKING';
                    this.target = closest;
                }
            } else if (this.state === 'ATTACKING') {
                if (this.target === boss) {
                    if (boss.state !== "FIGHTING") {
                        this.state = 'IDLE'; this.target = null; return;
                    }
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    this.angle = Math.atan2(dy, dx);
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;
                    
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < (this.target.radius + this.radius)) {
                        boss.hp--;
                        boss.hitFlash = 1.0;
                        this.active = false;
                        for(let i=0; i<8; i++) particles.push(new Particle(this.x, this.y, "#ccc"));
                        floatingTexts.push(new FloatingText(this.x, this.y, "-1 HP", "#ff3333"));
                    }
                    return;
                }

                if (!this.target.active || (this.target.x < -50 && !this.target.isBossProjectile)) {
                    this.state = 'IDLE';
                    this.target = null;
                    return;
                }
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                this.angle = Math.atan2(dy, dx);
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < (this.target.radius + this.radius)) {
                    this.target.active = false; 
                    this.active = false; 
                    for(let i=0; i<8; i++) particles.push(new Particle(this.x, this.y, "#ccc"));
                    floatingTexts.push(new FloatingText(this.x, this.y, "Gotcha!", "#eee"));
                }
            }
        }
        draw(ctx) {
            drawTextureRotated(imgFork, this.x, this.y, 40, 20, this.angle);
        }
    }

    // --- LOGIC ---

    function updateGame() {
        if(gameState === "AIRSHIP_TRADE") return;
        if(gameState === "PAUSED") return; 

        // World Scaling (Depth effect)
        if (zoomTimer > 0) {
            zoomTimer--;
            if (worldScale > 0.6) worldScale -= 0.01;
        } else {
            if (worldScale < 1.0) worldScale += 0.01;
        }
        
        if (repulseTimer > 0) repulseTimer--;

        // Calculate distance
        if (gameState !== "BOSS_ENTERING" && gameState !== "BOSS_FIGHT") {
            distance += (gameSpeed * 0.05); 
        }
        const km = distance / 100;
        const distEl = document.getElementById('distVal');
        if(distEl) distEl.innerText = km.toFixed(2);

        // --- CHECK TRIGGERS ---

        // 1. Boss Trigger (2km)
        if (gameState === "PLAYING" && km >= 2.0 && !bossEncountered) {
            gameState = "BOSS_ENTERING";
            storedSpeed = gameSpeed;
            gameSpeed = 0; 
            boss = new ScissorsBoss();
            items = items.filter(i => i.x > width); 
        }

        // 2. Airship Trigger
        else if (gameState === "PLAYING" && km >= nextAirshipKm) {
            nextAirshipKm = km + getRandomAirshipInterval();
            if (Math.random() < 0.65) {
                gameState = "AIRSHIP_APPROACH";
                storedSpeed = gameSpeed;
                airshipPos = { x: width + 400, y: height/2 }; 
                document.getElementById('pauseBtnContainer').classList.add('hidden');
                return;
            }
        }

        // --- PLAYER MOVEMENT ---
        if (gameState !== "AIRSHIP_CHOICE" && gameState !== "AIRSHIP_TRADE") {
            const moveSpeed = 5 + (GameData.upgrades.speed * 0.75);
            const adjustedSpeed = moveSpeed / worldScale; 

            // Vertical Movement
            if (keys.ArrowUp || keys.w) player.y -= adjustedSpeed;
            if (keys.ArrowDown || keys.s) player.y += adjustedSpeed;
            
            // Mouse/Touch Movement (Y Only)
            if (mouseTargetY !== null && (gameState.includes('PLAYING') || gameState.includes('AIRSHIP') || gameState.includes('BOSS'))) {
                const dy = mouseTargetY - player.y; 
                if (Math.abs(dy) > adjustedSpeed) player.y += Math.sign(dy) * adjustedSpeed;
                else player.y = mouseTargetY;
            }

            // Boundaries
            if (player.y < 20) player.y = 20;
            if (player.y > height - 20) player.y = height - 20;
            
            // حركة أفقية سلسة: ترجع ببطء ناحية اليسار (x = 70) عند ظهور البوس لإتاحة حرية الحركة والتفادي
            if (gameState === "BOSS_ENTERING" || gameState === "BOSS_FIGHT") {
                player.x += (10 - player.x) * 0.05;
            } else {
                player.x += (40 - player.x) * 0.05;
            }
        }

        // --- STATES UPDATE ---

        if (gameState === "BOSS_ENTERING") {
            if (cameraZoom > 0.7) cameraZoom -= 0.005;
            if(boss) boss.update();
        }
        else if (gameState === "BOSS_FIGHT") {
            if(boss) boss.update();
            
            if(boss) {
                const pct = (boss.hp / boss.maxHp) * 100;
                document.getElementById('bossHealthFill').style.width = pct + '%';
                
                const secs = Math.ceil(boss.survivalTimer / 60);
                const min = Math.floor(secs / 60);
                const s = secs % 60;
                document.getElementById('bossTimer').innerText = 
                    (min < 10 ? "0"+min : min) + ":" + (s < 10 ? "0"+s : s);
            }

            if (gameState === "BOSS_FIGHT" && frame % 180 === 0) {
                 items.push({ type: 'fork-pickup', x: width + 50, y: Math.random() * (height - 100) + 50, radius: 20, active: true, isBossProjectile:true, vx: -3, vy: 0 });
            }
        }

        else if (gameState === "AIRSHIP_APPROACH") {
            if (gameSpeed > 0) gameSpeed -= 0.01; else gameSpeed = 0;
            if (cameraZoom > 0.5) cameraZoom -= 0.002;
            airshipPos.x += ( (width - 250) - airshipPos.x ) * 0.03;
            player.y += (height/2 - player.y) * 0.05;

            if (gameSpeed <= 0 && Math.abs(airshipPos.x - (width-250)) < 20) {
                gameState = "AIRSHIP_CHOICE";
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('airshipMenu').classList.remove('hidden');
            }
        } 
        else if (gameState === "AIRSHIP_LEAVE") {
            if (cameraZoom < 1.0) cameraZoom += 0.005; 
            airshipPos.x += 8; 
            if (gameSpeed < storedSpeed) gameSpeed += 0.1;
            if (gameSpeed >= storedSpeed && cameraZoom >= 1.0) {
                gameSpeed = storedSpeed;
                cameraZoom = 1.0; 
                gameState = "PLAYING";
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('pauseBtnContainer').classList.remove('hidden');
            }
        }

        else if (gameState === "PLAYING") {
            const spawnX = (width / worldScale) + 100;

            if (frame % (50 - Math.min(score, 15)) === 0) {
                let spawnedSpecial = false;

                if (!spawnedSpecial && Math.random() > 0.95) { 
                    spawnedSpecial = true;
                    items.push({ type: 'fork-pickup', x: spawnX, y: Math.random() * (height - 100) + 50, radius: 20, active: true });
                }

                if (!spawnedSpecial && km >= 4 && Math.random() > 0.96) { 
                    spawnedSpecial = true;
                    items.push({ type: 'bird', x: spawnX, y: Math.random() * (height - 100) + 50, radius: 25, active: true, state: 'warning', warnTimer: 60 });
                }

                if (!spawnedSpecial) {
                    let type = 'leaf';
                    if (Math.random() > 0.75) {
                        let scissorPool = ['scissor'];
                        
                        if (km >= 4) {
                            scissorPool.push('scissor-purple');
                        }
                        if (km >= 6) {
                            scissorPool.push('scissor-yellow');
                        }

                        type = scissorPool[Math.floor(Math.random() * scissorPool.length)];
                    }

                    let itemRadius = 20;
                    if (type === 'scissor-yellow') itemRadius = 35;
                    
                    items.push({ type: type, x: spawnX, y: Math.random() * (height - 60) + 30, radius: itemRadius, active: true, currentAngle: Math.PI });
                }
            }
        } 

        // Update Forks
        activeForks.forEach(f => f.update());
        activeForks = activeForks.filter(f => f.active);
        activeForks.forEach((f, index) => { if(f.state === 'IDLE') f.offsetIndex = index; });

        // Update Items
        items.forEach(item => {
            if (repulseTimer > 0 && (item.type.includes('scissor') || item.type === 'bird')) {
                const dx = item.x - player.x;
                const dy = item.y - player.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const repulseRadius = 75; 

                if (dist < repulseRadius && dist > 0) {
                    const force = 3; 
                    item.x += (dx / dist) * force;
                    item.y += (dy / dist) * force;
                }
            }

            // Movement Logic
            if (item.isBossProjectile) {
                if (item.type === 'scissor-purple') {
                    const speed = 5.0; 
                    if (item.x > player.x) {
                        const dx = player.x - item.x;
                        const dy = player.y - item.y;
                        const targetAngle = Math.atan2(dy, dx);
                        let vx = Math.cos(item.currentAngle);
                        let vy = Math.sin(item.currentAngle);
                        let targetVx = Math.cos(targetAngle);
                        let targetVy = Math.sin(targetAngle);
                        const turnRate = 0.02; 
                        vx += (targetVx - vx) * turnRate;
                        vy += (targetVy - vy) * turnRate;
                        item.currentAngle = Math.atan2(vy, vx);
                    }
                    item.x += Math.cos(item.currentAngle) * speed;
                    item.y += Math.sin(item.currentAngle) * speed;
                } else if (item.vx !== undefined) {
                    item.x += item.vx;
                    item.y += item.vy;
                } else {
                    item.x -= 3; 
                }
            } else {
                if (item.type === 'bird') {
                    if (item.state === 'warning') {
                        item.x = (width/worldScale) + 50; 
                        item.warnTimer--;
                        if (item.warnTimer <= 0) item.state = 'flying';
                    } else {
                        item.x -= 15; 
                    }
                } else if (item.type === 'scissor-purple') {
                    const speed = 5.0; 
                    if (item.x > player.x) {
                        const dx = player.x - item.x;
                        const dy = player.y - item.y;
                        const targetAngle = Math.atan2(dy, dx);
                        let vx = Math.cos(item.currentAngle);
                        let vy = Math.sin(item.currentAngle);
                        let targetVx = Math.cos(targetAngle);
                        let targetVy = Math.sin(targetAngle);
                        const turnRate = 0.01; 
                        vx += (targetVx - vx) * turnRate;
                        vy += (targetVy - vy) * turnRate;
                        item.currentAngle = Math.atan2(vy, vx);
                    }
                    item.x += Math.cos(item.currentAngle) * speed;
                    item.y += Math.sin(item.currentAngle) * speed;
                } else {
                    item.x -= gameSpeed;
                }
                
                if (item.type === 'scissor-yellow' && !item.isBossProjectile) item.x += 1; 
                else if (item.type === 'leaf') {
                    const magnetRange = 50 + (GameData.upgrades.magnet * 15);
                    const dx = player.x - item.x;
                    const dy = player.y - item.y;
                    if (Math.sqrt(dx*dx + dy*dy) < magnetRange) {
                        item.x -= (item.x - player.x) * 0.05;
                        item.y -= (item.y - player.y) * 0.05;
                    }
                }
            }

            // Player Collision Logic
            const dx = player.x - item.x;
            const dy = player.y - item.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const hitDist = player.radius + item.radius;

            if (item.active && dist < hitDist && item.state !== 'warning') {
                if (gameState === "AIRSHIP_APPROACH") return;

                item.active = false;
                
                if (item.type === 'leaf') {
                    score++;
                    GameData.leaves++; 
                    for(let i=0; i<5; i++) particles.push(new Particle(item.x, item.y, "#76ff03"));
                    floatingTexts.push(new FloatingText(item.x, item.y - 20, "+1"));
                    if (score % 10 === 0 && gameState === "PLAYING") gameSpeed += 0.2;
                } 
                else if (item.type === 'fork-pickup') {
                    const stats = getForkStats();
                    if (activeForks.length < stats.count) {
                        while(activeForks.length < stats.count) {
                            activeForks.push(new Fork(activeForks.length));
                        }
                        floatingTexts.push(new FloatingText(player.x, player.y - 40, "Squad Ready!", "#ccc"));
                        for(let i=0; i<5; i++) particles.push(new Particle(item.x, item.y, "#fff"));
                    } else {
                        floatingTexts.push(new FloatingText(player.x, player.y - 40, "Full!", "#888"));
                    }
                }
                else {
                    if (hasShield) {
                        hasShield = false;
                        for(let i=0; i<10; i++) particles.push(new Particle(player.x, player.y, "#4facfe"));
                        floatingTexts.push(new FloatingText(player.x, player.y - 30, "Shield Break!", "#4facfe"));
                        document.getElementById('shieldHud').style.display = 'none';
                    } else {
                        window.gameManager.endGame();
                    }
                }
            }
        });

        items = items.filter(i => i.x > -100 && i.x < (width/worldScale) + 200 && i.active);
        document.getElementById('scoreVal').innerText = score;

        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);
        floatingTexts.forEach(t => t.update());
        floatingTexts = floatingTexts.filter(t => t.life > 0);
    }

    function draw() {
        ctx.clearRect(0, 0, width, height); 
        ctx.save();
        ctx.translate(width/2, height/2);
        
        if (gameState === "AIRSHIP_TRADE") {
            if (imgTrade.complete && imgTrade.naturalWidth > 0) {
                ctx.drawImage(imgTrade, -width/2, -height/2, width, height);
            } else {
                ctx.fillStyle = "#222";
                ctx.fillRect(-width/2, -height/2, width, height);
                ctx.fillStyle = "white";
                ctx.fillText("Trade.png missing", -50, 0);
            }
            ctx.restore();
            return;
        }

        const totalZoom = cameraZoom * worldScale;
        ctx.scale(totalZoom, totalZoom);
        ctx.translate(-width/2, -height/2);

        if (imgBg.complete && imgBg.naturalWidth > 0) {
             ctx.drawImage(imgBg, -width/2, -height/2, width * 2, height * 2);
        } else {
            ctx.fillStyle = "#162447";
            ctx.fillRect(-width, -height, width * 3, height * 3);
        }

        if (gameState !== "BOSS_FIGHT" && gameState !== "BOSS_ENTERING") {
            if (frame % 5 === 0) windParticles.push({x: width + 200, y: Math.random()*height, len: Math.random()*40+10, s: Math.random()*5+2});
        }
        
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        windParticles.forEach(p => {
            if(gameState !== "PAUSED") p.x -= p.s; 
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.len, p.y); ctx.stroke();
        });
        windParticles = windParticles.filter(p => p.x + p.len > -100);

        if(gameState.includes("AIRSHIP") && imgAirship.complete) {
            const hov = Math.sin(frame*0.05)*10;
            ctx.drawImage(imgAirship, airshipPos.x, airshipPos.y + hov - 90, 300, 180);
        }

        if (boss) boss.draw(ctx);

        activeForks.forEach(f => f.draw(ctx));

        items.forEach(item => {
            if (item.type === 'leaf') {
                drawTexture(imgGreen, item.x, item.y, 30, 30);
            } else if (item.type === 'fork-pickup') {
                ctx.save();
                ctx.shadowColor = "white"; ctx.shadowBlur = 10;
                drawTexture(imgFork, item.x, item.y, 40, 20);
                ctx.restore();
            } else if (item.type === 'scissor') {
                drawScissor(item.x, item.y, 1, "#ff3333", 0); 
            } else if (item.type === 'scissor-yellow') {
                drawScissor(item.x, item.y, 1.8, "#ffcc00", 0);
            } else if (item.type === 'scissor-purple') {
                drawScissor(item.x, item.y, 1, "#d500f9", item.currentAngle); 
            } else if (item.type === 'bird') {
                drawBird(item);
            }
        });

        if (gameState !== 'GAMEOVER') {
            drawTexture(imgPlayer, player.x, player.y, 50, 30);
            if (hasShield) {
                ctx.strokeStyle = "#4facfe"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(player.x, player.y, 28, 0, Math.PI*2); ctx.stroke();
            }
        }

        particles.forEach(p => p.draw(ctx));
        floatingTexts.forEach(t => t.draw(ctx));

        ctx.restore();
    }

    function drawTexture(img, x, y, w, h) {
        if (!img || !img.complete || img.naturalWidth === 0) {
            ctx.save(); ctx.translate(x, y); ctx.fillStyle = "#888"; 
            ctx.beginPath(); ctx.arc(0,0, w/3, 0, Math.PI*2); ctx.fill(); ctx.restore(); return;
        }
        ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(frame * 0.1) * 0.2);
        ctx.drawImage(img, -w/2, -h/2, w, h); ctx.restore();
    }

    function drawTextureRotated(img, x, y, w, h, angle) {
        if (!img || !img.complete || img.naturalWidth === 0) {
            ctx.save(); ctx.translate(x, y); ctx.fillStyle = "#ccc"; 
            ctx.beginPath(); ctx.arc(0,0, w/3, 0, Math.PI*2); ctx.fill(); ctx.restore(); return;
        }
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
        ctx.drawImage(img, -w/2, -h/2, w, h); ctx.restore();
    }

    function drawScissor(x, y, scale, color, rotationAngle) {
        const f = (gameState === "PAUSED") ? frame : frame;
        const angle = Math.abs(Math.sin(f * (0.2 / scale))) * 0.5; 
        
        ctx.save(); 
        ctx.translate(x, y);
        if (rotationAngle !== 0) ctx.rotate(rotationAngle - Math.PI); 
        ctx.scale(scale, scale); 
        
        ctx.save(); ctx.rotate(-angle);
        ctx.fillStyle = "#C0C0C0"; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-30,-5); ctx.lineTo(0,-10); ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(15, -5, 8, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
        
        ctx.save(); ctx.rotate(angle);
        ctx.fillStyle = "#C0C0C0"; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-30,5); ctx.lineTo(0,10); ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(15, 5, 8, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
        
        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function drawBird(bird) {
        if (bird.state === 'warning') {
            const alpha = (Math.sin(frame * 0.5) + 1) / 2 * 0.5 + 0.2;
            ctx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
            ctx.fillRect(-width*2, bird.y - 2, width*4, 4);
            ctx.save(); ctx.translate(width - 40, bird.y);
            ctx.fillStyle = "#ff3333"; ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(15, 15); ctx.lineTo(-15, 15); ctx.fill();
            ctx.fillStyle = "black"; ctx.font = "bold 24px 'Daily Bubble', Arial"; 
            ctx.textAlign = "center"; ctx.fillText("!", 0, 8); ctx.restore();
        } else {
            drawTexture(imgBird, bird.x, bird.y, 80, 60);
        }
    }

    // --- GAME MANAGER ---
    const gameManager = {
        startGame: () => {
            if(window.menuMusic) window.menuMusic.stop();
            if(window.airMusic && !GameData.settings.muteAir) window.airMusic.start();

            gameState = "PLAYING"; score = 0; distance = 0; gameSpeed = 4;
            items = []; particles = []; activeForks = [];
            player.y = height / 2;
            player.x = 100; 
            nextAirshipKm = getRandomAirshipInterval(); 
            cameraZoom = 1.0; worldScale = 1.0; zoomTimer = 0; repulseTimer = 0;
            bossEncountered = false; boss = null;
            document.getElementById('bossHud').style.opacity = 0;

            hasShield = GameData.upgrades.shield > 0;
            const sHud = document.getElementById('shieldHud');
            if(sHud) sHud.style.display = hasShield ? 'block' : 'none';
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('pauseBtnContainer').classList.remove('hidden');
            updateUI();
        },
        endGame: () => {
            if(window.airMusic) window.airMusic.stop();
            if(window.menuMusic && !GameData.settings.muteMenu) window.menuMusic.start();

            gameState = "GAMEOVER"; saveData();
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalDist').innerText = (distance / 100).toFixed(2);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('bossHud').style.opacity = 0;
            document.getElementById('pauseBtnContainer').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
        },
        
        togglePause: () => {
            if (gameState === "PLAYING" || gameState === "BOSS_FIGHT") {
                gameState = "PAUSED";
                document.getElementById('pauseMenu').classList.remove('hidden');
                document.getElementById('hud').style.opacity = "0.5";
            } else if (gameState === "PAUSED") {
                mouseTargetY = player.y;
                gameState = boss ? "BOSS_FIGHT" : "PLAYING";
                document.getElementById('pauseMenu').classList.add('hidden');
                document.getElementById('hud').style.opacity = "1";
            }
        },

        enterAirship: () => {
            gameState = "AIRSHIP_TRADE";
            document.getElementById('airshipMenu').classList.add('hidden');
            document.getElementById('tradeMenu').classList.remove('hidden');
            document.getElementById('tradeLeaves').innerText = score;
        },
        leaveAirship: () => {
            document.getElementById('airshipMenu').classList.add('hidden');
            document.getElementById('tradeMenu').classList.add('hidden');
            gameState = "AIRSHIP_LEAVE";
        },

        buyTradeItem: (type, cost) => {
            if (type === 'fork') {
                const stats = getForkStats();
                if (activeForks.length >= stats.count) {
                    alert("Fork capacity full! Upgrade to hire more.");
                    return;
                }
            }

            if (score >= cost) {
                let success = false;
                if (type === 'fork') { activeForks.push(new Fork(activeForks.length)); success = true; } 
                else if (type === 'shield') {
                    if (!hasShield) { hasShield = true; document.getElementById('shieldHud').style.display = 'block'; success = true; } 
                    else { alert("Shield already active!"); }
                } 
                
                if (success) {
                    playModernBuy();
                    score -= cost;
                    GameData.leaves -= cost; 
                    saveData(); 
                    document.getElementById('tradeLeaves').innerText = score;
                    updateUI();
                }
            } else { alert("Not enough leaves collected this run!"); }
        },

        toMainMenu: () => {
            if(window.airMusic) window.airMusic.stop();
            if(window.menuMusic && !GameData.settings.muteMenu) window.menuMusic.start();

            gameState = "MENU";
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseMenu').classList.add('hidden'); 
            document.getElementById('pauseBtnContainer').classList.add('hidden'); 
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('bossHud').style.opacity = 0;
            document.getElementById('hud').style.opacity = "1";
            document.getElementById('mainMenu').classList.remove('hidden');
            updateUI();
        },
        openUpgrades: () => {
            const grid = document.querySelector('.upgrade-grid');
            grid.innerHTML = '';
            Object.keys(UPGRADE_CONFIG).forEach(key => {
                const conf = UPGRADE_CONFIG[key];
                const currentLvl = GameData.upgrades[key] || 0;
                const cost = conf.baseCost * (currentLvl + 1);
                const isMaxed = currentLvl >= conf.max;
                const div = document.createElement('div');
                div.className = 'upgrade-card';
                div.innerHTML = `
                    <div class="upg-info"><div class="upg-name">${conf.name}</div><div class="upg-desc">${conf.desc}</div><div class="upg-level">Lvl: ${currentLvl}/${conf.max}</div></div>
                    <button class="buy-btn" onclick="window.gameManager.buyUpgrade('${key}', ${cost})" ${isMaxed || GameData.leaves < cost ? 'disabled' : ''}>${isMaxed ? 'MAX' : cost + ' 🍃'}</button>`;
                grid.appendChild(div);
            });
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('upgradeMenu').classList.remove('hidden');
        },
        buyUpgrade: (key, cost) => {
            if (GameData.leaves >= cost) {
                playModernBuy();
                GameData.leaves -= cost; 
                if(!GameData.upgrades[key]) GameData.upgrades[key] = 0;
                GameData.upgrades[key]++;
                saveData(); gameManager.openUpgrades();
            }
        },
        closeUpgrades: () => {
            document.getElementById('upgradeMenu').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        },

        /* --- OPTIONS LOGIC --- */
        openOptions: () => {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('optionsMenu').classList.remove('hidden');
            updateAudioButtons();
        },
        closeOptions: () => {
            document.getElementById('optionsMenu').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        },
        toggleMenuMusic: () => {
            GameData.settings.muteMenu = !GameData.settings.muteMenu;
            if(GameData.settings.muteMenu) {
                if(window.menuMusic) window.menuMusic.stop();
            } else {
                if(window.menuMusic && gameState === "MENU") window.menuMusic.start();
            }
            saveData();
            updateAudioButtons();
        },
        toggleAirMusic: () => {
            GameData.settings.muteAir = !GameData.settings.muteAir;
            if(GameData.settings.muteAir) {
                if(window.airMusic) window.airMusic.stop();
            } else {
                if(window.airMusic && gameState === "PLAYING") window.airMusic.start();
            }
            saveData();
            updateAudioButtons();
        },
        resetData: () => {
            if(confirm("Are you sure you want to reset all progress?")) {
                GameData = { 
                    leaves: 0, 
                    upgrades: { speed: 0, magnet: 0, shield: 0, fork: 0 },
                    settings: GameData.settings 
                };
                saveData(); alert("Data reset!");
            }
        }
    };
    window.gameManager = gameManager;

    try {
        loadData();
        function loop() {
            if ((gameState === "PLAYING" || gameState.includes("AIRSHIP") || gameState.includes("BOSS"))) updateGame();
            draw(); 
            if(gameState !== "PAUSED") frame++;
            requestAnimationFrame(loop);
        }
        loop();
    } catch(e) { alert("Initialization Failed: " + e.message); }
</script>

<script>
    function initAudioContext() {
        if (window.menuMusic && !GameData.settings.muteMenu) {
            window.menuMusic.start();
            console.log("Menu Music Started!");
        }
        document.body.removeEventListener('click', initAudioContext);
        document.body.removeEventListener('touchstart', initAudioContext);
        document.body.removeEventListener('keydown', initAudioContext);
    }
    document.body.addEventListener('click', initAudioContext);
    document.body.addEventListener('touchstart', initAudioContext);
    document.body.addEventListener('keydown', initAudioContext);
</script>
</body>
</html>
